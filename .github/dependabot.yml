version: 2
updates:
- package-ecosystem: bundler
  directory: "/apps/klipper-api"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
- package-ecosystem: npm
  directory: "/apps/klipper-web"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
- package-ecosystem: npm
  directory: "/apps/quebec-web"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
