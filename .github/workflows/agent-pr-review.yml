name: Revisão automática de PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'reports/**'
      - 'docs/adrs/**'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Número do PR a revisar'
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    # Guard-rails: (1) anti-loop — nunca revisar PR aberto pelo próprio pipeline
    # de relatórios (peter-evans/create-pull-request roda como github-actions[bot]);
    # (2) anti-prompt-injection (SEC-13/LLM01) — PR de fork tem Bash + GH_TOKEN
    # disponíveis ao agente, então só roda automático para PRs do próprio repo.
    # Fork PR ainda pode ser revisado, mas só via workflow_dispatch manual
    # (exige permissão de escrita no repo para disparar).
    # (3) PR do Dependabot roda com "Secret source: Dependabot", um cofre
    # separado que não enxerga os Actions secrets — o CLAUDE_CODE_OAUTH_TOKEN
    # chega vazio e o job falha em ~2s, indistinguível de token expirado. Não é
    # algo que rerun resolva: era ruído vermelho garantido em toda atualização
    # de dependência. Revisão de PR do Dependabot fica no workflow_dispatch,
    # que roda no contexto normal e vê os secrets (PIPE-3).
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.user.login != 'github-actions[bot]' &&
       github.event.pull_request.user.login != 'dependabot[bot]' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolver número do PR
        id: pr
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.pr_number }}" ]; then
            echo "number=${{ inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar OUTPUT_PATH
        run: echo "OUTPUT_PATH=${{ runner.temp }}/pr-review.md" >> "$GITHUB_ENV"

      - name: Revisão via Claude Code
        id: claude
        uses: anthropics/claude-code-action@c96dd0a84e0232ab86947fca5fe34f1caae8792f # v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash,Write"
            --max-turns 30
            --debug
          prompt: |
            Leia integralmente `.github/claude-prompts/pr-review.md` e siga suas
            instruções por completo.

            O diff a avaliar é o da Pull Request #${{ steps.pr.outputs.number }}
            deste repositório. Obtenha o diff real com
            `gh pr diff ${{ steps.pr.outputs.number }}` (já autenticado via GH_TOKEN)
            em vez de supor o que mudou.

            Escreva o comentário Markdown final (só o conteúdo do comentário,
            sem texto antes ou depois) no arquivo indicado pela variável de
            ambiente OUTPUT_PATH.

      # TEMPORARIO — remover apos diagnosticar o is_error:true do agente.
      # A versao anterior lia o arquivo linha a linha assumindo JSONL, mas a
      # action grava um JSON unico formatado em varias linhas: nenhuma linha
      # isolada era JSON valido, entao o passo nunca imprimia o erro. Agora
      # carrega o arquivo inteiro e cai pra JSONL so se isso falhar.
      - name: Erro do agente (diagnostico temporario)
        if: failure()
        run: |
          python3 - "${{ steps.claude.outputs.execution_file }}" <<'PY'
          import json, sys

          bruto = open(sys.argv[1]).read()
          try:
              registros = json.loads(bruto)
              if isinstance(registros, dict):
                  registros = [registros]
          except json.JSONDecodeError:
              registros = []
              for linha in bruto.splitlines():
                  linha = linha.strip()
                  if not linha:
                      continue
                  try:
                      registros.append(json.loads(linha))
                  except json.JSONDecodeError:
                      pass

          print("=== registros no arquivo:", len(registros), "===")
          for d in registros:
              if not isinstance(d, dict):
                  continue
              tipo = d.get("type")
              if tipo == "result":
                  print("=== result ===")
                  print(json.dumps(d, indent=2, ensure_ascii=False))
              elif tipo in ("error", "system") or d.get("is_error"):
                  print(f"=== {tipo} ===")
                  print(json.dumps(d, indent=2, ensure_ascii=False)[:4000])
          PY

      - name: Publicar comentário no PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A action se recusa a rodar quando o arquivo do workflow difere do que
        # está no branch default, e nesse caso ela termina com sucesso sem
        # escrever o OUTPUT_PATH. Consequência: todo PR que mexe neste próprio
        # arquivo tinha o review vermelho com `no such file or directory`, uma
        # mensagem que não diz nada sobre a causa — e que, por construção, só
        # deixa de aparecer depois do merge. Agora a ausência do arquivo vira um
        # comentário explicando por que a revisão não saiu, em vez de um portão
        # vermelho enganoso.
        run: |
          if [ ! -f "$OUTPUT_PATH" ]; then
            gh pr comment "${{ steps.pr.outputs.number }}" --body \
              "⚠️ A revisão automática não produziu saída neste run — nenhum comentário de análise foi gerado. Causa mais comum: este PR altera \`.github/workflows/agent-pr-review.yml\`, e a action exige que o arquivo seja idêntico ao do branch default, então ela se recusa a rodar. Nesse caso a revisão volta a funcionar depois do merge. Veja o log do job \`review\` para confirmar."
            echo "OUTPUT_PATH ausente: comentário de aviso publicado, job segue verde."
            exit 0
          fi
          gh pr comment "${{ steps.pr.outputs.number }}" --body-file "$OUTPUT_PATH"
