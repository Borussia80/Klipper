name: Revisão automática de PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'reports/**'
      - 'docs/adrs/**'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Número do PR a revisar'
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    # Guard-rails: (1) anti-loop — nunca revisar PR aberto pelo próprio pipeline
    # de relatórios (peter-evans/create-pull-request roda como github-actions[bot]);
    # (2) anti-prompt-injection (SEC-13/LLM01) — PR de fork tem Bash + GH_TOKEN
    # disponíveis ao agente, então só roda automático para PRs do próprio repo.
    # Fork PR ainda pode ser revisado, mas só via workflow_dispatch manual
    # (exige permissão de escrita no repo para disparar).
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.user.login != 'github-actions[bot]' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolver número do PR
        id: pr
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.pr_number }}" ]; then
            echo "number=${{ inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar OUTPUT_PATH
        run: echo "OUTPUT_PATH=${{ runner.temp }}/pr-review.md" >> "$GITHUB_ENV"

      - name: Revisão via Claude Code
        id: claude
        uses: anthropics/claude-code-action@c96dd0a84e0232ab86947fca5fe34f1caae8792f # v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash,Write"
            --max-turns 30
          prompt: |
            Leia integralmente `.github/claude-prompts/pr-review.md` e siga suas
            instruções por completo.

            O diff a avaliar é o da Pull Request #${{ steps.pr.outputs.number }}
            deste repositório. Obtenha o diff real com
            `gh pr diff ${{ steps.pr.outputs.number }}` (já autenticado via GH_TOKEN)
            em vez de supor o que mudou.

            Escreva o comentário Markdown final (só o conteúdo do comentário,
            sem texto antes ou depois) no arquivo indicado pela variável de
            ambiente OUTPUT_PATH.

      # TEMPORARIO — remover apos diagnosticar o is_error:true do agente.
      # A action esconde a mensagem de erro ate em modo debug; so grava o JSONL
      # em execution_file, que nao sobe como artifact. Imprime apenas o campo
      # `result` do registro de resultado: a mensagem da API, nada mais.
      - name: Erro do agente (diagnostico temporario)
        if: failure()
        run: |
          python3 - "${{ steps.claude.outputs.execution_file }}" <<'PY'
          import json, sys
          for linha in open(sys.argv[1]):
              linha = linha.strip()
              if not linha:
                  continue
              try:
                  d = json.loads(linha)
              except json.JSONDecodeError:
                  continue
              if d.get("type") == "result":
                  print("=== result ===")
                  print(d.get("result") or "(campo result vazio)")
                  print("=== subtype:", d.get("subtype"), "| is_error:", d.get("is_error"), "===")
          PY

      - name: Publicar comentário no PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment "${{ steps.pr.outputs.number }}" --body-file "$OUTPUT_PATH"
