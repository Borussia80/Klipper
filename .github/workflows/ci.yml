name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          working-directory: apps/klipper-api
          bundler-cache: true
      - name: Brakeman security scan
        run: bin/brakeman --no-pager
        working-directory: apps/klipper-api
      - name: Bundler audit
        run: bin/bundler-audit
        working-directory: apps/klipper-api

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          working-directory: apps/klipper-api
          bundler-cache: true
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/klipper-api/tmp/rubocop
          key: rubocop-${{ runner.os }}-${{ hashFiles('apps/klipper-api/.rubocop.yml', 'apps/klipper-api/Gemfile.lock') }}
      - name: RuboCop
        run: bin/rubocop -f github
        working-directory: apps/klipper-api

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: klipper_test
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/klipper_test
      RAILS_ENV: test
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          working-directory: apps/klipper-api
          bundler-cache: true
      - name: Setup database
        run: bundle exec rails db:schema:load
        working-directory: apps/klipper-api
      - name: Run RSpec
        run: bundle exec rspec --format progress
        working-directory: apps/klipper-api

  # Portão completo do frontend: mudanças em Vue/TypeScript só entram com
  # lint, tipos e comportamento verificados no mesmo checkout.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/klipper-web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: apps/klipper-web
      # vitest.config.ts usa `environment: 'nuxt'`, e tsconfig.json estende
      # ./.nuxt/tsconfig.json — que só existe depois do prepare. Sem este passo
      # todos os 38 arquivos falham no checkout limpo com ERR_MODULE_NOT_FOUND;
      # local passa porque .nuxt já está no disco. Não há postinstall no
      # package.json que faça isso por conta própria.
      - name: Prepare Nuxt
        run: npx nuxt prepare
        working-directory: apps/klipper-web
      - name: Run ESLint
        run: npm run lint
        working-directory: apps/klipper-web
      - name: Run typecheck
        run: npm run typecheck
        working-directory: apps/klipper-web
      - name: Run Vitest
        run: npm run test
        working-directory: apps/klipper-web
      # lint, typecheck e Vitest passam sem nunca montar o bundle de produção,
      # então uma árvore de dependências que quebra o `nuxt build` chegava
      # verde até a Vercel — depois do merge. Este passo traz essa falha para
      # o PR.
      - name: Build de produção
        run: npm run build
        working-directory: apps/klipper-web

  # Sem este job o quebec-web não tinha portão nenhum, e o lockfile dele ficou
  # parado enquanto o do klipper-web — mesmo range de nuxt — avançava: o app
  # acumulou uma RCE crítica no @nuxt/devtools sem nada reclamar (SEC-001).
  quebec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/quebec-web/package-lock.json
      # `npm ci` também é o que pega lockfile fora de sincronia com o
      # package.json — foi assim que o desalinhamento do dependabot apareceu.
      - name: Install dependencies
        run: npm ci
        working-directory: apps/quebec-web
      - name: Prepare Nuxt
        run: npx nuxt prepare
        working-directory: apps/quebec-web
      - name: Run typecheck
        run: npm run typecheck
        working-directory: apps/quebec-web
      - name: Build de produção
        run: npm run build
        working-directory: apps/quebec-web
      # Corta em critical, não em high: sobram 3 high vindas de
      # @nuxt/image -> ipx -> sharp que só saem com @nuxt/image 2.x, e travar o
      # portão numa decisão semver-major pendente só ensinaria a ignorá-lo.
      - name: npm audit
        run: npm audit --audit-level=critical
        working-directory: apps/quebec-web
