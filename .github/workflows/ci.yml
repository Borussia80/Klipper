name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4 # v1.323.0
        with:
          working-directory: apps/klipper-api
          bundler-cache: true
      - name: Brakeman security scan
        run: bin/brakeman --no-pager
        working-directory: apps/klipper-api
      - name: Bundler audit
        run: bin/bundler-audit
        working-directory: apps/klipper-api

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4 # v1.323.0
        with:
          working-directory: apps/klipper-api
          bundler-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/klipper-api/tmp/rubocop
          key: rubocop-${{ runner.os }}-${{ hashFiles('apps/klipper-api/.rubocop.yml', 'apps/klipper-api/Gemfile.lock') }}
      - name: RuboCop
        run: bin/rubocop -f github
        working-directory: apps/klipper-api

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: klipper_test
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/klipper_test
      RAILS_ENV: test
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4 # v1.323.0
        with:
          working-directory: apps/klipper-api
          bundler-cache: true
      - name: Setup database
        run: bundle exec rails db:schema:load
        working-directory: apps/klipper-api
      - name: Run RSpec
        run: bundle exec rspec --format progress
        working-directory: apps/klipper-api

  # Portão completo do frontend: mudanças em Vue/TypeScript só entram com
  # lint, tipos e comportamento verificados no mesmo checkout.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/klipper-web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: apps/klipper-web
      # vitest.config.ts usa `environment: 'nuxt'`, e tsconfig.json estende
      # ./.nuxt/tsconfig.json — que só existe depois do prepare. Sem este passo
      # todos os 38 arquivos falham no checkout limpo com ERR_MODULE_NOT_FOUND;
      # local passa porque .nuxt já está no disco. Não há postinstall no
      # package.json que faça isso por conta própria.
      - name: Prepare Nuxt
        run: npx nuxt prepare
        working-directory: apps/klipper-web
      - name: Run ESLint
        run: npm run lint
        working-directory: apps/klipper-web
      - name: Run typecheck
        run: npm run typecheck
        working-directory: apps/klipper-web
      - name: Run Vitest
        run: npm run test
        working-directory: apps/klipper-web
      # lint, typecheck e Vitest passam sem nunca montar o bundle de produção,
      # então uma árvore de dependências que quebra o `nuxt build` chegava
      # verde até a Vercel — depois do merge. Este passo traz essa falha para
      # o PR.
      - name: Build de produção
        run: npm run build
        working-directory: apps/klipper-web
      # O quebec-web tinha portão de audit e o klipper-web — o app de verdade,
      # com token JWT e dados financeiros — não tinha nenhum: as 3 high deste
      # commit (fast-uri, js-yaml, svgo, todas transitivas) chegaram verdes até
      # aqui. Corte em high, não em critical, porque é na faixa high que moram
      # prototype pollution e ReDoS; e não em moderate, porque sobra 1 low do
      # esbuild que o `npm audit fix` promete e não aplica — um portão que nasce
      # vermelho é um portão que se aprende a ignorar (SEC-003).
      - name: npm audit
        run: npm audit --audit-level=high
        working-directory: apps/klipper-web

  # Sem este job o quebec-web não tinha portão nenhum, e o lockfile dele ficou
  # parado enquanto o do klipper-web — mesmo range de nuxt — avançava: o app
  # acumulou uma RCE crítica no @nuxt/devtools sem nada reclamar (SEC-001).
  # Os scripts que montam o relatório de auditoria decidem que ID permanente
  # cada finding recebe. Um erro aqui não quebra o app, corrompe o histórico de
  # dívida — que é justamente o que não dá para reconstruir depois.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # Sem dependências: os scripts usam só builtins do Node e o runner de
      # teste nativo, então não há npm ci nem lockfile para sincronizar.
      - name: Testes dos scripts de relatório
        run: node --test '.github/scripts/__tests__/*.test.mjs'

  quebec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/quebec-web/package-lock.json
      # `npm ci` também é o que pega lockfile fora de sincronia com o
      # package.json — foi assim que o desalinhamento do dependabot apareceu.
      - name: Install dependencies
        run: npm ci
        working-directory: apps/quebec-web
      - name: Prepare Nuxt
        run: npx nuxt prepare
        working-directory: apps/quebec-web
      - name: Run typecheck
        run: npm run typecheck
        working-directory: apps/quebec-web
      - name: Build de produção
        run: npm run build
        working-directory: apps/quebec-web
      # Cortava em critical porque sobravam 3 high vindas de
      # @nuxt/image -> ipx -> sharp que exigiam @nuxt/image 2.x. Essas saíram
      # nas atualizações desde então: hoje o quebec-web tem 1 low e mais nada,
      # então o corte em high já nasce verde e passa a valer de verdade —
      # critical deixava passar toda a faixa onde vive um RCE transitivo, que é
      # exatamente como o @nuxt/devtools do SEC-001 entrou sem ninguém ver.
      - name: npm audit
        run: npm audit --audit-level=high
        working-directory: apps/quebec-web
