name: Backup do Postgres de produção

# DESATIVADO: o banco de produção agora é local (servidor em casa) e o runner do
# GitHub não alcança a rede local. O backup passou para scripts/backup/ (timer
# do systemd no servidor). Este workflow só volta a valer se o banco voltar para
# um host público.
on:
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar postgresql-client e age
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client age

      - name: Gerar dump e cifrar com age
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          # Sem isto, uma secret ausente ou vazia faz o pg_dump cair no socket
          # local do runner ("No such file or directory") e o erro real some.
          for var in DATABASE_URL AGE_RECIPIENT; do
            if [ -z "${!var:-}" ]; then
              echo "::error title=Secret ausente::${var} está vazia — confira BACKUP_DATABASE_URL e BACKUP_AGE_PUBLIC_KEY em Settings > Secrets and variables > Actions."
              exit 1
            fi
          done
          TIMESTAMP=$(date -u +%Y%m%d-%H%M%S)
          echo "TAG=backup-${TIMESTAMP}" >> "$GITHUB_ENV"
          ASSET="klipper_${TIMESTAMP}.pgdump.age"
          echo "ASSET=${ASSET}" >> "$GITHUB_ENV"
          pg_dump "$DATABASE_URL" --format=custom --file=dump.pgdump
          age --encrypt --recipient "$AGE_RECIPIENT" --output "$ASSET" dump.pgdump
          rm -f dump.pgdump

      - name: Publicar como Release no repositório privado de backups
        env:
          GH_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          gh release create "$TAG" "$ASSET" \
            --repo "${{ vars.BACKUP_REPO }}" \
            --title "Backup $TAG" \
            --notes "Backup automático do Postgres de produção (klipper-api), cifrado com age."

      - name: Podar backups com mais de 12 semanas
        env:
          GH_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          set -euo pipefail
          CUTOFF=$(date -u -d '12 weeks ago' +%s)
          gh release list --repo "${{ vars.BACKUP_REPO }}" --limit 200 --json tagName,createdAt \
            | jq -r --argjson cutoff "$CUTOFF" '.[] | select((.createdAt | fromdateiso8601) < $cutoff) | .tagName' \
            | while read -r tag; do
                echo "Removendo release expirada: $tag"
                gh release delete "$tag" --repo "${{ vars.BACKUP_REPO }}" --yes --cleanup-tag
              done
